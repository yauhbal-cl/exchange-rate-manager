openapi: 3.0.3
info:
  title: Exchange Rate Management System API
  version: 0.1.0
  description: >
    Sample contract for the scaffolding feature. Proves the shared-contract
    generation pipeline (backend server interfaces + frontend typed client)
    end-to-end. Real domain endpoints (rates, conversion, AI insight) are
    added by later features onto this same file — this file, at
    `contracts/openapi.yaml` in the repo root, is the single hand-maintained
    source of truth; never hand-edit generated output on either side.
servers:
  - url: /api/v1
paths:
  /status:
    get:
      operationId: getStatus
      summary: Report service and database health
      tags: [Status]
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
        '503':
          description: Service is unhealthy (e.g. database unreachable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
components:
  schemas:
    ServiceStatus:
      type: object
      required: [status, databaseConnected, timestamp]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        databaseConnected:
          type: boolean
        timestamp:
          type: string
          format: date-time
