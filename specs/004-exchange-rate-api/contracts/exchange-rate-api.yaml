# Phase 1 contract fragment: Exchange Rate API
#
# This documents the paths/schemas to be merged into contracts/openapi.yaml (the real source of
# truth per CLAUDE.md — edit that file directly during implementation; this fragment is the
# design record, not a second source).

paths:
  /exchange:
    get:
      operationId: getExchangeRate
      summary: Get the spread-adjusted exchange rate between two currencies
      tags: [Exchange Rate Lookup]
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            pattern: '^[A-Z]{3}$'
          description: Source currency code
        - name: to
          in: query
          required: true
          schema:
            type: string
            pattern: '^[A-Z]{3}$'
          description: Target currency code
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Rate date to use; omit for the most recent date both currencies share
      responses:
        '200':
          description: Spread-adjusted exchange rate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRateResponse'
        '400':
          description: >
            Invalid input — missing/malformed currency code, identical from/to currencies, or an
            unknown currency code
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No stored rate data for the requested (or most recent common) date
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /exchange/usage:
    get:
      operationId: getUsageAnalytics
      summary: Get per-currency usage analytics
      tags: [Exchange Rate Usage Analytics]
      responses:
        '200':
          description: Per-currency usage statistics (empty array if no lookups yet)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageAnalyticsResponse'

components:
  schemas:
    ExchangeRateResponse:
      type: object
      required: [fromCurrency, toCurrency, rate, rateDate, fromCurrencyUsageCount, toCurrencyUsageCount]
      properties:
        fromCurrency:
          type: string
        toCurrency:
          type: string
        rate:
          type: string
          format: decimal
          description: Spread-adjusted rate, exact decimal (transported as string to avoid float precision loss)
        rateDate:
          type: string
          format: date
        fromCurrencyUsageCount:
          type: integer
          format: int64
        toCurrencyUsageCount:
          type: integer
          format: int64
    UsageAnalyticsResponse:
      type: object
      required: [currencies]
      properties:
        currencies:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyUsageEntry'
    CurrencyUsageEntry:
      type: object
      required: [currencyCode, queryCount, lastQueriedAt]
      properties:
        currencyCode:
          type: string
        queryCount:
          type: integer
          format: int64
        lastQueriedAt:
          type: string
          format: date-time
          nullable: true
          description: Null if this currency has never been queried
