services:
  postgres:
    image: postgres:17
    container_name: exchange-rate-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exchange_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exchange_password}
      POSTGRES_DB: ${POSTGRES_DB:-exchange_rate_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -p 5432 -U ${POSTGRES_USER:-exchange_user} -d ${POSTGRES_DB:-exchange_rate_db}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: exchange-rate-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-pull:
    image: ollama/ollama:latest
    container_name: exchange-rate-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "llama3.2"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: exchange-rate-backend
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-exchange_rate_db}
      POSTGRES_USER: ${POSTGRES_USER:-exchange_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exchange_password}
      OLLAMA_BASE_URL: http://ollama:11434
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      FIXER_API_KEY: ${FIXER_API_KEY:?Set FIXER_API_KEY in your shell or a .env file}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: exchange-rate-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"

volumes:
  postgres_data:
  ollama_data:
