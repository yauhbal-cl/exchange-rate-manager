spring:
  application:
    name: Exchange Rate Manager
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:exchange_rate_db}
    username: ${POSTGRES_USER:exchange_user}
    password: ${POSTGRES_PASSWORD:exchange_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      initialization-fail-timeout: 0
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: llama3.2
    retry:
      # Spring AI's default retry (10 attempts, exponential backoff up to 3 min) would delay
      # the AI-unavailable failure far past the read-timeout above; this feature is stateless
      # and reports unavailability immediately instead (research.md "Recovery/reset behavior").
      max-attempts: 1
  # spring-ai-ollama 2.0.1 exposes no chat/client-level read-timeout property;
  # OllamaApi uses Boot's shared auto-configured RestClient.Builder, so its connect/read
  # timeouts are set via the generic properties below. The Fixer client deliberately uses
  # its own request factory and does not inherit these AI-oriented values.
  http:
    clients:
      connect-timeout: ${AI_INSIGHT_CONNECT_TIMEOUT_SECONDS:5}s
      read-timeout: ${AI_INSIGHT_TIMEOUT_SECONDS:30}s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

fixer:
  api-key: ${FIXER_API_KEY}
  base-url: ${FIXER_BASE_URL:https://data.fixer.io/api}
  http:
    connect-timeout: ${FIXER_CONNECT_TIMEOUT_SECONDS:3}s
    read-timeout: ${FIXER_READ_TIMEOUT_SECONDS:10}s
    retry:
      max-attempts: ${FIXER_RETRY_MAX_ATTEMPTS:3}
      initial-delay: ${FIXER_RETRY_INITIAL_DELAY_MILLIS:500}ms
      multiplier: ${FIXER_RETRY_MULTIPLIER:2.0}
      max-delay: ${FIXER_RETRY_MAX_DELAY_MILLIS:1000}ms

exchange-rates:
  base-currency: EUR
  default-spread-percent: 2.75
  spreads:
    EUR: 0.00
    JPY: 3.25
    HKD: 3.25
    KRW: 3.25
    MYR: 4.50
    INR: 4.50
    MXN: 4.50
    RUB: 6.00
    CNY: 6.00
    ZAR: 6.00
